<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Transaction</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="container">

    <h1>✏️ Edit Transaction</h1>

    <form method="POST">

        <input type="date"
               name="date"
               value="{{ transaction['date'] }}"
               required>

        <select name="type" required>
            <option value="Income" {% if transaction['type']=="Income" %}selected{% endif %}>Income</option>
            <option value="Expense" {% if transaction['type']=="Expense" %}selected{% endif %}>Expense</option>
        </select>

        <input type="text"
               name="category"
               value="{{ transaction['category'] }}"
               required>

        <input type="number"
               step="0.01"
               name="amount"
               value="{{ transaction['amount'] }}"
               required>

        <select name="payment_method">
            <option value="Cash" {% if transaction['payment_method']=="Cash" %}selected{% endif %}>Cash</option>
            <option value="UPI" {% if transaction['payment_method']=="UPI" %}selected{% endif %}>UPI</option>
            <option value="Debit Card" {% if transaction['payment_method']=="Debit Card" %}selected{% endif %}>Debit Card</option>
            <option value="Credit Card" {% if transaction['payment_method']=="Credit Card" %}selected{% endif %}>Credit Card</option>
            <option value="Net Banking" {% if transaction['payment_method']=="Net Banking" %}selected{% endif %}>Net Banking</option>
        </select>

        <input type="text"
               name="description"
               value="{{ transaction['description'] }}">

        <select name="status">
            <option value="Completed" {% if transaction['status']=="Completed" %}selected{% endif %}>Completed</option>
            <option value="Pending" {% if transaction['status']=="Pending" %}selected{% endif %}>Pending</option>
        </select>

        <br><br>

        <button type="submit">💾 Update Transaction</button>

        <a href="/dashboard">
            <button type="button">⬅ Back</button>
        </a>

    </form>

</div>

</body>
</html>
